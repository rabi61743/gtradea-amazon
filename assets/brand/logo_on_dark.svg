<?xml version="1.0" encoding="UTF-8"?>
<!--
  The GtradeA mark for a dark surface.

  Identical geometry to logo.svg -- the same three path definitions from the
  storefront's own icon.svg, byte for byte. The only difference is the second
  shape's fill: the palette's near-white (#f2ece6) instead of Trust Blue.

  It was Premium Ivory until that colour was dropped from the brand. This file
  is a derivation of the supplied mark, not the supplied mark itself -- the
  geometry is untouched and only the fill that this file exists to change has
  changed -- so it follows the palette rather than keeping a hex the palette no
  longer contains.

  That is not a restyling, it is the reason two files exist. The header band is
  Trust Blue, and the light-surface mark's teal quarter is the *same* #267488,
  so on the band it vanishes and the logo reads as a lone orange crescent.
  Measured on a screenshot before this file was written: the logo region and the
  band beside it were both #267488.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.6 36.2 173.6 158.7">
  <path fill="#e94724" d="M169.34,126.56v43.61c-13.86,14.04-33,22.72-54.15,22.72-17.96,0-34.47-6.27-47.53-16.76,2.02.17,4.08.26,6.15.26,32.3,0,59.9-20.67,70.89-49.83h24.64Z"/>
  <polygon fill="#f2ece6" points="208.22 93.95 208.22 192.69 169.34 192.69 169.34 126.56 104.52 126.56 128.57 94 128.6 93.95 208.22 93.95"/>
  <path fill="#e94724" d="M169.48,38.16v.45l-10.32,13.98-10.57,14.3-20.02,27.11c-40.36,1.22-72.79,31.59-73.62,69.18-10.22-13.15-16.3-29.73-16.3-47.75,0-40.15,30.19-73.15,68.83-76.89,2.41-.25,4.87-.37,7.36-.37h54.65Z"/>
</svg>
